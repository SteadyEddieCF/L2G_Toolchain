name: Package Workshop v78

on:
  pull_request:
    paths:
      - '.github/workflows/workshop-v78-release.yml'
      - 'modules/workshop/releases/v78/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-workshop-v78:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic Workshop v78 release artifacts
        run: python modules/workshop/releases/v78/package_release.py
      - name: Upload standalone HTML and complete deliverables
        uses: actions/upload-artifact@v4
        with:
          name: workshop-v78-release-artifacts
          path: modules/workshop/releases/v78/dist/*
          if-no-files-found: error
          retention-days: 30