name: Quality Browser Accessibility and Visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-linux:
    name: Current workflows, accessibility, visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix apps/integrated-suite-v0.6
          npx playwright install --with-deps chromium
      - name: Build current Integrated Suite artifact
        working-directory: apps/integrated-suite-v0.6
        run: npm run build
      - name: Run representative current workflows and serious/critical axe gates
        run: npx playwright test tests/playwright/integrated-suite-v06.spec.mjs tests/playwright/accessibility.spec.mjs --project=chromium
      - name: Run focused existing visual regression suite
        run: npm run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-browser-linux
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  chromium-windows-file-origin:
    name: Native Windows Chromium file origin
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix apps/integrated-suite-v0.6
          npx playwright install chromium
      - name: Build current Integrated Suite artifact
        working-directory: apps/integrated-suite-v0.6
        run: npm run build
      - name: Run current Integrated Suite native file-origin smoke
        run: npx playwright test tests/playwright/integrated-suite-v06-file-smoke.spec.mjs --project=chromium
      - name: Run registered standalone native file-origin routes
        run: npm run test:file
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-browser-windows-file-origin
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
