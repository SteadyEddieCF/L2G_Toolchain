name: Integrated Suite Encrypted Project v0.2

on:
  pull_request:
    paths:
      - 'apps/integrated-suite-v0.2/**'
      - 'contracts/registry.json'
      - 'tests/playwright/integrated-suite-v02*.mjs'
      - '.github/workflows/integrated-suite-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v02-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.2/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked v0.2 build dependency
        run: npm ci --prefix apps/integrated-suite-v0.2 --no-audit --no-fund
      - name: Typecheck, build, validate, run crypto vectors, and rebuild deterministically
        run: npm test --prefix apps/integrated-suite-v0.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run encrypted project, recovery, profile, and accessibility tests
        run: npx playwright test tests/playwright/integrated-suite-v02.spec.mjs --project=chromium
      - name: Upload v0.2 Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v02-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/integrated-suite-v0.2/dist/**
            apps/integrated-suite-v0.2/releases/v0.2.0/**
            apps/integrated-suite-v0.2/build/fixtures/**
            test-results/**

  v02-windows-file-origin:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.2/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked v0.2 build dependency
        run: npm ci --prefix apps/integrated-suite-v0.2 --no-audit --no-fund
      - name: Build and validate v0.2
        run: npm test --prefix apps/integrated-suite-v0.2
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run native Windows file-origin v0.2 smoke
        run: npx playwright test tests/playwright/integrated-suite-v02-file.spec.mjs --project=chromium
      - name: Upload Windows file-origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v02-windows-file-origin
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/integrated-suite-v0.2/dist/**
            apps/integrated-suite-v0.2/releases/v0.2.0/**
            test-results/**
