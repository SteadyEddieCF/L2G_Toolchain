name: Workbook Merge Preservation Contract

on:
  pull_request:
    paths:
      - '.github/workflows/workbook-merge-preservation-contract.yml'
      - 'contracts/reconciliations/workbook_merge_v1_1_governance_preservation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical and adversarial fixtures
        run: python contracts/reconciliations/workbook_merge_v1_1_governance_preservation/validate_extension_fixtures.py
