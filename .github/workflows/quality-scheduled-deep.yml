name: Quality Scheduled Deep Validation

on:
  schedule:
    - cron: '41 7 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-scheduled-deep
  cancel-in-progress: false

jobs:
  deep-property-and-current-suite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact test dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix apps/integrated-suite-v0.6
          python -m pip install --disable-pip-version-check -r quality/requirements.txt
          npx playwright install --with-deps chromium
      - name: Run larger deterministic property and fuzz profile
        env:
          L2G_HYPOTHESIS_EXAMPLES: '1000'
        run: npm run test:fuzz
      - name: Build current Integrated Suite artifact
        working-directory: apps/integrated-suite-v0.6
        run: npm run build
      - name: Run current Integrated Suite browser regression
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scheduled-deep-quality-evidence
          path: |
            quality-reports/
            test-results/
            playwright-report/
            .hypothesis/
          if-no-files-found: warn
          retention-days: 21
