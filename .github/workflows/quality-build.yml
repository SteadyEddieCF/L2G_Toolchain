name: Quality Build and File Safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-unit-contract-file:
    name: Policy, unit, contracts, file safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact property-test dependencies
        run: python -m pip install --disable-pip-version-check -r quality/requirements.txt
      - name: Run deterministic unit and property tests
        run: npm run test:unit
      - name: Validate baseline and current contracts
        run: |
          python quality/scripts/quality_gate.py baseline
          python quality/scripts/quality_gate.py contracts
      - name: Validate privacy and high-risk workflow rules
        run: |
          python quality/scripts/quality_gate.py privacy
          python quality/scripts/quality_gate.py workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-policy-unit-contract-file
          path: quality-reports/
          if-no-files-found: error
          retention-days: 14

  current-release-linux:
    name: Current release build, package, offline, semantic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked current-release dependencies
        working-directory: apps/integrated-suite-v0.6
        run: npm ci --no-audit --no-fund
      - name: Run current release type, build, domain, migration, scale, hygiene, and determinism gates
        working-directory: apps/integrated-suite-v0.6
        run: npm test
      - name: Package actual deterministic release candidate
        working-directory: apps/integrated-suite-v0.6
        run: python scripts/package_release.py
      - name: Validate packaged offline, semantic, SBOM, checksum, and manifest boundaries
        run: |
          python quality/scripts/quality_gate.py offline
          python quality/scripts/quality_gate.py html
          python quality/scripts/quality_gate.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-current-release-linux
          path: |
            apps/integrated-suite-v0.6/dist/
            quality-reports/
          if-no-files-found: error
          retention-days: 14
