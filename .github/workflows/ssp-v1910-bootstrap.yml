name: SSP v1.9.10 Bootstrap
on:
  push:
    branches:
      - agent/ssp-v1.9.10-ux3-needs-attention
    paths:
      - .github/workflows/ssp-v1910-bootstrap.yml
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize SSP v1.9.6 runtime
        run: python modules/ssp/releases/v1.9.6/materialize.py
      - name: Materialize SSP v1.9.7 runtime
        run: python modules/ssp/releases/v1.9.7/materialize.py
      - name: Materialize SSP v1.9.8 runtime and governed artifacts
        run: python modules/ssp/releases/v1.9.8/materialize.py
      - name: Materialize promoted SSP v1.9.9 runtime and governed artifacts
        run: python modules/ssp/releases/v1.9.9/materialize.py
      - name: Verify promoted identities
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
            "modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Modern_Editable_v1.9.9.html": "4df58dd45c369fd2c3ec6e49e81fa8887f80859dddd4fbd9b00f410679144927",
            "modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Data_Schema_v1.9.9.json": "2d093d34b6260822d8be2547a50c3dc5c6c3e73100c9f0fc6fcb2794a84903b1",
            "modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Built_In_Review_Profile_Registry_v1.9.9.json": "8deb8917615046f9b85ed34f7c5fac061f6756e44cbd6a8677e935487bfedfc2",
            "modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Built_In_Review_Profile_Registry_Schema_v1.1.json": "a0ca7d06d5811c73015f79ac2f763efe6534c791bd02e48d77a71dfe075ae67f",
          }
          for name, wanted in expected.items():
            actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
            assert actual == wanted, (name, actual, wanted)
            print(name, actual)
      - name: Upload exact promoted baseline
        uses: actions/upload-artifact@v4
        with:
          name: ssp-v199-promoted-baseline
          path: |
            modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Modern_Editable_v1.9.9.html
            modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Data_Schema_v1.9.9.json
            modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Built_In_Review_Profile_Registry_v1.9.9.json
            modules/ssp/releases/v1.9.9/CMMC_L2_SSP_Built_In_Review_Profile_Registry_Schema_v1.1.json
          if-no-files-found: error
