name: Integrated Suite Scope v0.6

on:
  pull_request:
    paths:
      - 'apps/integrated-suite-v0.6/**'
      - 'apps/integrated-suite-v0.5/**'
      - 'apps/integrated-suite-v0.4/**'
      - 'apps/integrated-suite-v0.3/**'
      - 'apps/integrated-suite-v0.2/**'
      - 'tests/playwright/integrated-suite-v06*'
      - '.github/workflows/integrated-suite-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v06-candidate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked v0.6 build dependency
        working-directory: apps/integrated-suite-v0.6
        run: npm ci --no-audit --no-fund
      - name: Typecheck, build, and validate v0.6 package
        working-directory: apps/integrated-suite-v0.6
        run: npm run typecheck && npm run build && npm run validate
      - name: Compile v0.6 domain harness
        working-directory: apps/integrated-suite-v0.6
        run: npx tsc -p tsconfig.domain-test.json
      - name: Run inherited-domain and deterministic project smoke
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_domain.mjs
      - name: Run Scope authority, candidate, diagram, profile, and import tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_scope.mjs
      - name: Run Engagement, Evidence, Pre-Engagement, and Interview publication boundary tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_targets.mjs
      - name: Run migration, encryption, tamper, and Undo/Redo tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_project.mjs
      - name: Run bounded Scope scale and graph tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_scale.mjs
      - name: Run public-hygiene and deterministic-build gates
        working-directory: apps/integrated-suite-v0.6
        run: npm run test:hygiene && npm run test:determinism
      - name: Package deterministic v0.6 candidate
        working-directory: apps/integrated-suite-v0.6
        run: python scripts/package_release.py
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v0.6 and v0.6.1 Scope workflow, disclosure, import, decision, publication, diagram, advisor, responsive, accessibility, and zero-network tests
        run: npx playwright test tests/playwright/integrated-suite-v06.spec.mjs tests/playwright/integrated-suite-v061.spec.mjs tests/playwright/integrated-suite-v061-diagram.spec.mjs tests/playwright/integrated-suite-v061-advisor.spec.mjs --project=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v06-linux-candidate
          path: |
            apps/integrated-suite-v0.6/dist/
            test-results/
            playwright-report/
          if-no-files-found: error

  v06-candidate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked v0.6 build dependency
        working-directory: apps/integrated-suite-v0.6
        run: npm ci --no-audit --no-fund
      - name: Typecheck, build, and validate v0.6 package
        working-directory: apps/integrated-suite-v0.6
        run: npm run typecheck && npm run build && npm run validate
      - name: Compile v0.6 domain harness
        working-directory: apps/integrated-suite-v0.6
        run: npx tsc -p tsconfig.domain-test.json
      - name: Run inherited-domain and deterministic project smoke
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_domain.mjs
      - name: Run Scope authority, candidate, diagram, profile, and import tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_scope.mjs
      - name: Run Engagement, Evidence, Pre-Engagement, and Interview publication boundary tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_targets.mjs
      - name: Run migration, encryption, tamper, and Undo/Redo tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_project.mjs
      - name: Run bounded Scope scale and graph tests
        working-directory: apps/integrated-suite-v0.6
        run: node scripts/test_v06_scale.mjs
      - name: Run public-hygiene gate
        working-directory: apps/integrated-suite-v0.6
        run: npm run test:hygiene
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run native Windows file-origin v0.6 Scope workflow smoke
        run: npx playwright test tests/playwright/integrated-suite-v06-file-smoke.spec.mjs --project=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v06-windows-candidate
          path: |
            apps/integrated-suite-v0.6/dist/
            test-results/
            playwright-report/
          if-no-files-found: error
