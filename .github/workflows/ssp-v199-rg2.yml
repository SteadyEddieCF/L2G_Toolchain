name: SSP v1.9.9 RG2
on:
  pull_request:
    paths:
      - "modules/ssp/releases/v1.9.9/**"
      - "tests/playwright/ssp-v199-rg2.spec.mjs"
      - ".github/workflows/ssp-v199-rg2.yml"
jobs:
  windows-file-origin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install chromium
      - run: python modules/ssp/releases/v1.9.9/materialize.py
      - run: npx playwright test tests/playwright/ssp-v199-rg2.spec.mjs --project=chromium --reporter=line
