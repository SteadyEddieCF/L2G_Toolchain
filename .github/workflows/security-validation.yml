name: Security Validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  ZIZMOR_VERSION: '1.28.0'

jobs:
  dependencies:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.6/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit root QA dependencies; block high and critical
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high --json > npm-audit-root.json || { cat npm-audit-root.json; exit 1; }
      - name: Audit current Integrated Suite dependencies; block high and critical
        run: |
          npm ci --no-audit --no-fund --prefix apps/integrated-suite-v0.6
          npm --prefix apps/integrated-suite-v0.6 audit --audit-level=high --json > npm-audit-integrated-v06.json || { cat npm-audit-integrated-v06.json; exit 1; }
      - name: Audit exact Python quality dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r quality/requirements.txt --format json --output pip-audit-quality.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            npm-audit-*.json
            pip-audit-quality.json
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Gitleaks repository and history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate governed SSP data-token identifiers
        run: python quality/scripts/validate_ssp_data_tokens.py
      - name: Install checksum-pinned Gitleaks release
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks version
      - name: Scan repository content and history
        shell: bash
        run: |
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --log-opts='--all'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 14

  workflows-and-privacy:
    name: Workflow security and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run version-pinned Zizmor offline and retain advisory report
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
          zizmor --collect=workflows --format=json . > zizmor-report.json || true
      - name: Block high-risk workflow patterns and report legacy pinning debt
        run: python quality/scripts/quality_gate.py workflows
      - name: Block high-confidence sensitive-data patterns
        run: python quality/scripts/quality_gate.py privacy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workflow-privacy-reports
          path: |
            quality-reports/
            zizmor-report.json
          if-no-files-found: error
          retention-days: 14
