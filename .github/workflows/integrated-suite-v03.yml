name: Integrated Suite Engagement Spine v0.3

on:
  pull_request:
    paths:
      - 'apps/integrated-suite-v0.3/**'
      - 'apps/integrated-suite-v0.2/src/util.ts'
      - 'apps/integrated-suite-v0.2/src/zip.ts'
      - 'apps/integrated-suite-v0.2/contracts/registry.json'
      - 'tests/playwright/integrated-suite-v03*.mjs'
      - '.github/workflows/integrated-suite-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v03-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked v0.3 build dependency
        run: npm ci --prefix apps/integrated-suite-v0.3 --no-audit --no-fund
      - name: Typecheck, build, validate, run domain and crypto tests, and rebuild deterministically
        run: npm test --prefix apps/integrated-suite-v0.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run engagement, migration, recovery, profile, responsive, and accessibility tests
        run: npx playwright test tests/playwright/integrated-suite-v03.spec.mjs --project=chromium
      - name: Upload v0.3 Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v03-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/integrated-suite-v0.3/dist/**
            apps/integrated-suite-v0.3/releases/v0.3.0/**
            apps/integrated-suite-v0.3/build/fixtures/**
            test-results/**

  v03-windows-file-origin:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/integrated-suite-v0.3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked v0.3 build dependency
        run: npm ci --prefix apps/integrated-suite-v0.3 --no-audit --no-fund
      - name: Build and validate v0.3 on Windows
        run: npm test --prefix apps/integrated-suite-v0.3
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run native Windows file-origin v0.3 smoke
        run: npx playwright test tests/playwright/integrated-suite-v03-file.spec.mjs --project=chromium
      - name: Upload Windows file-origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-suite-v03-windows-file-origin
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/integrated-suite-v0.3/dist/**
            apps/integrated-suite-v0.3/releases/v0.3.0/**
            apps/integrated-suite-v0.3/build/fixtures/**
            test-results/**
