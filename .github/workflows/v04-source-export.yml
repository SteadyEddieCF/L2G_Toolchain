name: Temporary v0.4 source export

on:
  push:
    branches:
      - agent/integrated-suite-v0.4.0-evidence-catalog
    paths:
      - '.github/workflows/v04-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v04-source-export
          retention-days: 1
          if-no-files-found: error
          path: |
            apps/integrated-suite-v0.4/**
            tests/playwright/integrated-suite-v04*.mjs
            .github/workflows/integrated-suite-v04.yml
