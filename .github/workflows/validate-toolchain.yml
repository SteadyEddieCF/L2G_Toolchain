name: Validate L2G Toolchain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize Control Center v0.3.4 runtime
        run: python modules/control-center/releases/0.3.4/build_release.py
      - name: Materialize Workshop v77 runtime
        run: python modules/workshop/releases/v77/build_release.py
      - name: Materialize Workshop v78 runtime
        run: python modules/workshop/releases/v78/build_release.py
      - name: Materialize Workshop v79 runtime
        run: python modules/workshop/releases/v79/build_release.py
      - name: Materialize SSP v1.9.6 runtime
        run: python modules/ssp/releases/v1.9.6/materialize.py
      - name: Run SSP v1.9.6 bounded static gate
        run: python modules/ssp/releases/v1.9.6/tests/test_ssp_v196_static.py
      - name: Materialize SSP v1.9.7 runtime
        run: python modules/ssp/releases/v1.9.7/materialize.py
      - name: Run SSP v1.9.7 bounded static gate
        run: python modules/ssp/releases/v1.9.7/tests/test_ssp_v197_static.py
      - name: Materialize SSP v1.9.8 runtime, schema, and profile registry
        run: python modules/ssp/releases/v1.9.8/materialize.py
      - name: Run SSP v1.9.8 bounded static gate
        run: python modules/ssp/releases/v1.9.8/tests/test_ssp_v198_static.py
      - name: Materialize SSP v1.9.9 runtime, schema, and profile registry
        run: python modules/ssp/releases/v1.9.9/materialize.py
      - name: Run SSP v1.9.9 bounded static gate
        run: python modules/ssp/releases/v1.9.9/tests/test_ssp_v199_static.py
      - name: Materialize SSP v1.9.10 runtime
        run: python modules/ssp/releases/v1.9.10/materialize.py
      - name: Run SSP v1.9.10 bounded static gate
        run: python modules/ssp/releases/v1.9.10/tests/test_ssp_v1910_static.py
      - name: Materialize SSP v1.9.11 runtime and schema
        run: python modules/ssp/releases/v1.9.11/materialize.py
      - name: Run SSP v1.9.11 bounded static gate
        run: python modules/ssp/releases/v1.9.11/tests/test_ssp_v1911_static.py
      - name: Validate repository
        run: python scripts/validate_toolchain.py
  ssp-v1911-static-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python modules/ssp/releases/v1.9.6/materialize.py
      - run: python modules/ssp/releases/v1.9.7/materialize.py
      - run: python modules/ssp/releases/v1.9.8/materialize.py
      - run: python modules/ssp/releases/v1.9.9/materialize.py
      - run: python modules/ssp/releases/v1.9.10/materialize.py
      - run: python modules/ssp/releases/v1.9.11/materialize.py
      - run: python modules/ssp/releases/v1.9.11/tests/test_ssp_v1911_static.py
