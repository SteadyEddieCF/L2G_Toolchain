name: Validate L2G Toolchain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize Control Center v0.3.4 runtime
        run: python modules/control-center/releases/0.3.4/build_release.py
      - name: Materialize Workshop v77 runtime
        run: python modules/workshop/releases/v77/build_release.py
      - name: Materialize Workshop v78 runtime
        run: python modules/workshop/releases/v78/build_release.py
      - name: Capture Workshop v78 candidate identity
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('modules/workshop/releases/v78/cmmc_l2_gap_workshop_tool_v78.html')
          data={'exists':p.exists(),'size_bytes':p.stat().st_size if p.exists() else 0,'sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else ''}
          Path('workshop-v78-candidate-identity.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          print(data)
          PY
      - name: Upload Workshop v78 candidate identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-v78-candidate-identity
          path: workshop-v78-candidate-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate repository
        run: python scripts/validate_toolchain.py
